AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Flies for a Cause - per-environment Route53 alias records pointing the
  website domain at its CloudFront distribution and the API domain at its
  API Gateway custom domain. Depends on dns-zone.yaml, base.yaml,
  hosting.yaml, and api-gateway.yaml having already been deployed for this
  environment.

Parameters:
  Environment:
    Type: String
    Description: The deployment environment this stack belongs to.
    AllowedValues:
      - dev
      - prod

Resources:
  WebsiteAliasRecordSetGroup:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !ImportValue flies-for-a-cause-dns-HostedZoneId
      RecordSets:
        - Name: !ImportValue
            "Fn::Sub": "flies-for-a-cause-${Environment}-WebsiteDomainName"
          Type: A
          AliasTarget:
            # Fixed hosted zone ID used by every CloudFront distribution, in every account/region.
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !ImportValue
              "Fn::Sub": "flies-for-a-cause-${Environment}-WebsiteDistributionDomainName"
            EvaluateTargetHealth: false
        - Name: !ImportValue
            "Fn::Sub": "flies-for-a-cause-${Environment}-WebsiteDomainName"
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !ImportValue
              "Fn::Sub": "flies-for-a-cause-${Environment}-WebsiteDistributionDomainName"
            EvaluateTargetHealth: false

  ApiAliasRecordSetGroup:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !ImportValue flies-for-a-cause-dns-HostedZoneId
      RecordSets:
        - Name: !ImportValue
            "Fn::Sub": "flies-for-a-cause-${Environment}-ApiDomainName"
          Type: A
          AliasTarget:
            # Unlike CloudFront's fixed hosted zone ID, API Gateway's regional
            # domain hosted zone ID varies by region/account, so it's imported
            # rather than hardcoded.
            HostedZoneId: !ImportValue
              "Fn::Sub": "flies-for-a-cause-${Environment}-ApiDomainRegionalHostedZoneId"
            DNSName: !ImportValue
              "Fn::Sub": "flies-for-a-cause-${Environment}-ApiDomainRegionalDomainName"
            EvaluateTargetHealth: false
        - Name: !ImportValue
            "Fn::Sub": "flies-for-a-cause-${Environment}-ApiDomainName"
          Type: AAAA
          AliasTarget:
            HostedZoneId: !ImportValue
              "Fn::Sub": "flies-for-a-cause-${Environment}-ApiDomainRegionalHostedZoneId"
            DNSName: !ImportValue
              "Fn::Sub": "flies-for-a-cause-${Environment}-ApiDomainRegionalDomainName"
            EvaluateTargetHealth: false
